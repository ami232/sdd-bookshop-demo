<!doctype html>
<meta charset="utf-8">
<title>Bookshop</title>
<h1>Bookshop</h1>
<h2>Catalog</h2>
<ul id="products"></ul>
<h2>Orders</h2>
<button id="order">Order product 1</button>
<p id="message"></p>
<ul id="orders"></ul>
<script src="config.js"></script>
<script>
  // The service addresses come from config.js: localhost or Codespaces in compose, Azure after a deploy.
  const CATALOG = window.CONFIG.CATALOG_URL;
  const ORDERS = window.CONFIG.ORDERS_URL;
  async function load() {
    const products = await (await fetch(CATALOG + "/products")).json();
    document.getElementById("products").innerHTML = products.map(p => `<li>${p.id}. ${p.name}, ${p.price}</li>`).join("");
    const orders = await (await fetch(ORDERS + "/orders")).json();
    document.getElementById("orders").innerHTML = orders.map(o => `<li>order ${o.id}: product ${o.product_id} x ${o.quantity}</li>`).join("");
  }
  document.getElementById("order").onclick = async () => {
    const r = await fetch(ORDERS + "/orders", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({product_id: 1, quantity: 1})});
    document.getElementById("message").textContent = r.ok ? "Order created" : (await r.json()).detail;
    load();
  };
  // A blocked request (CORS, private port) only shows in the browser console: say so on the page.
  load().catch(e => {
    document.getElementById("message").textContent =
      `Cannot reach the services (${e.message}). In a Codespace: ports 8001 and 8002 Public, and UI_ORIGIN in .env. On Azure: the CORS setting of each Container App (see README).`;
  });
</script>
