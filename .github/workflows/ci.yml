name: CI

on:
  push:
    branches-ignore: [main]   # on main, cd.yml runs this workflow
  pull_request:
  workflow_call:            # lets a deploy workflow reuse this one

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog, orders]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # lets GITHUB_TOKEN push to ghcr.io
    strategy:
      matrix:
        service: [catalog, orders]
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase, and the owner name may not be.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false     # a plain image: Container Apps can't pull a tag that points to an attestation index
          tags: ghcr.io/${{ env.OWNER }}/bookshop-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
