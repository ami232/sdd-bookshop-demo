# Deploys to Azure on every push to main, only if CI passed on the same commit.
name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false      # never cancel a deploy half way

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml     # tests, then builds and pushes the images (the ref is main)
    permissions:
      contents: read
      packages: write                    # a called workflow gets no more permissions than its caller grants

  deploy:
    needs: ci
    if: vars.PREFIX != ''                # skipped until the Azure setup has stored the variables
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                    # lets the job ask GitHub for the OIDC token azure/login uses
    env:
      PREFIX: ${{ vars.PREFIX }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      UI_STORAGE: ${{ vars.UI_STORAGE }}
      SERVICES: catalog orders           # the folder names under services/
    steps:
      - uses: actions/checkout@v4
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the services (images tagged with this commit)
        run: |
          for svc in $SERVICES; do
            az containerapp update --name "$PREFIX-$svc" --resource-group "$RESOURCE_GROUP" \
              --image "ghcr.io/$OWNER/bookshop-$svc:$GITHUB_SHA" --output none
          done

      - name: Generate the UI configuration
        run: |
          fqdn() {
            az containerapp show --name "$PREFIX-$1" --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn --output tsv
          }
          cat > ui/config.js <<JS
          window.CONFIG = {
            CATALOG_URL: "https://$(fqdn catalog)",
            ORDERS_URL: "https://$(fqdn orders)"
          };
          JS
          cat ui/config.js

      - name: Deploy the UI to the storage static website
        run: |
          az storage blob upload-batch --account-name "$UI_STORAGE" --auth-mode key \
            --destination '$web' --source ui --overwrite --output none

      - name: Check /health of each service
        run: |
          # The first request starts the container and may wake the paused database (up to about a minute).
          for svc in $SERVICES; do
            url="https://$(az containerapp show --name "$PREFIX-$svc" --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn --output tsv)/health"
            ok=0
            for attempt in $(seq 1 24); do
              code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$url" || true)
              echo "$svc attempt $attempt: HTTP $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            [ "$ok" = "1" ] || { echo "::error::$svc did not return 200 in time"; exit 1; }
          done
